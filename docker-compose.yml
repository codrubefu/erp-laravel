services:
  app-urr:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: erp-laravel-app
    working_dir: /var/www
    volumes:
      - ./:/var/www

  web-urr:
    image: nginx:stable-alpine
    container_name: erp-laravel-web
    ports:
      - "8099:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app-urr


volumes:
  dbdata:
